name: TechTrends - Resolver OG

on:
  workflow_dispatch:
    inputs:
      noticiaId:
        description: "IdNoticia"
        required: true
        type: string

      url:
        description: "URL pública"
        required: true
        type: string

      year:
        description: "Año"
        required: true
        type: string

      month:
        description: "Mes"
        required: true
        type: string

  repository_dispatch:
    types:
      - techtrends_news_image


permissions:
  contents: write
  issues: write


jobs:

  resolve-og:

    runs-on: ubuntu-latest

    env:
      TECHTRENDS_BRANCH: main

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==================================================
      # PYTHON
      # ==================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Instalar dependencias
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow


      # ==================================================
      # PARAMETROS
      # ==================================================

      - name: Preparar parámetros
        id: params
        shell: bash
        run: |

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then

            NOTICIA_ID="${{ github.event.client_payload.noticiaId }}"
            URL="${{ github.event.client_payload.url }}"
            YEAR="${{ github.event.client_payload.year }}"
            MONTH="${{ github.event.client_payload.month }}"

          else

            NOTICIA_ID="${{ inputs.noticiaId }}"
            URL="${{ inputs.url }}"
            YEAR="${{ inputs.year }}"
            MONTH="${{ inputs.month }}"

          fi

          echo "noticia_id=$NOTICIA_ID" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"


      - name: Mostrar parámetros
        shell: bash
        run: |

          echo "Noticia:"
          echo "${{ steps.params.outputs.noticia_id }}"

          echo "URL:"
          echo "${{ steps.params.outputs.url }}"

          echo "Año:"
          echo "${{ steps.params.outputs.year }}"

          echo "Mes:"
          echo "${{ steps.params.outputs.month }}"


      # ==================================================
      # OG
      # ==================================================

      - name: Resolver OG
        shell: bash
        run: |

          python scripts/resolve_og.py \
            "${{ steps.params.outputs.noticia_id }}" \
            "${{ steps.params.outputs.url }}" \
            "${{ steps.params.outputs.year }}" \
            "${{ steps.params.outputs.month }}"


      - name: Mostrar resultado
        shell: bash
        run: |

          echo "================================"
          echo "RESULTADO OG"
          echo "================================"

          cat output/result.json


      # ==================================================
      # GUARDAR DATOS DE LA NOTICIA
      # ==================================================

      - name: Guardar datos OG en repositorio
        shell: bash
        run: |

          NOTICIA_PATH="recap-data/${{ steps.params.outputs.year }}/${{ steps.params.outputs.month }}/${{ steps.params.outputs.noticia_id }}"

          echo "Ruta:"
          echo "$NOTICIA_PATH"

          git config user.name "techtrends-bot"
          git config user.email "techtrends-bot@users.noreply.github.com"

          git add "$NOTICIA_PATH"

          if git diff --cached --quiet; then

            echo "No hay cambios que guardar."

            exit 0

          fi

          git commit \
            -m "Resolve OG ${{ steps.params.outputs.noticia_id }}"

          SUCCESS=false

          for ATTEMPT in 1 2 3 4 5
          do

            echo "--------------------------------"
            echo "Intento de push: $ATTEMPT"
            echo "--------------------------------"

            if git pull --rebase origin main
            then

              if git push origin HEAD:main
              then

                echo "Push completado."

                SUCCESS=true

                break

              fi

            fi

            git rebase --abort || true

            WAIT_TIME=$((ATTEMPT * 2))

            echo "Esperando ${WAIT_TIME}s..."

            sleep "$WAIT_TIME"

          done

          if [ "$SUCCESS" != "true" ]; then

            echo "ERROR:"
            echo "No se pudo guardar la información OG."

            exit 1

          fi


      # ==================================================
      # ISSUE DE COMUNICACION CON POWER AUTOMATE
      # ==================================================

      - name: Crear o actualizar Issue
        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          ISSUE_TITLE="TT-OG ${{ steps.params.outputs.noticia_id }}"

          echo "Buscando:"
          echo "$ISSUE_TITLE"

          ISSUE_NUMBER="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state all \
              --search "\"$ISSUE_TITLE\" in:title" \
              --limit 1 \
              --json number \
              --jq '.[0].number // empty'
          )"


          if [ -n "$ISSUE_NUMBER" ]; then

            echo "Issue existente:"
            echo "#$ISSUE_NUMBER"

            gh issue edit \
              "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file output/result.json

            gh issue reopen \
              "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              || true

          else

            echo "Creando issue."

            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --body-file output/result.json

          fi

name: TechTrends - Resolver OG Image

on:
  workflow_dispatch:
    inputs:
      noticiaId:
        description: "ID de la noticia en TT_Noticias"
        required: true
        type: string

      url:
        description: "URL de la noticia"
        required: true
        type: string

  repository_dispatch:
    types:
      - techtrends_news_image

jobs:
  resolve-og:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4 pillow

      - name: Preparar parámetros
        id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "noticia_id=${{ github.event.client_payload.noticiaId }}" >> "$GITHUB_OUTPUT"
            echo "url=${{ github.event.client_payload.url }}" >> "$GITHUB_OUTPUT"
          else
            echo "noticia_id=${{ inputs.noticiaId }}" >> "$GITHUB_OUTPUT"
            echo "url=${{ inputs.url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Buscar imagen OG
        run: |
          python scripts/resolve_og.py \
            "${{ steps.params.outputs.noticia_id }}" \
            "${{ steps.params.outputs.url }}"

      - name: Subir resultado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: techtrends-og-${{ steps.params.outputs.noticia_id }}
          path: output/*
          if-no-files-found: error

name: TechTrends - Resolver OG Image

on:
  workflow_dispatch:
    inputs:
      noticiaId:
        description: "IdNoticia"
        required: true
        type: string

      url:
        description: "URL pública de la noticia"
        required: true
        type: string

      year:
        description: "Año"
        required: true
        type: string

      month:
        description: "Mes"
        required: true
        type: string

  repository_dispatch:
    types:
      - techtrends_news_image

permissions:
  contents: write

jobs:
  resolve-og:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4 pillow

      - name: Preparar parámetros
        id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            NOTICIA_ID="${{ github.event.client_payload.noticiaId }}"
            URL="${{ github.event.client_payload.url }}"
            YEAR="${{ github.event.client_payload.year }}"
            MONTH="${{ github.event.client_payload.month }}"
          else
            NOTICIA_ID="${{ inputs.noticiaId }}"
            URL="${{ inputs.url }}"
            YEAR="${{ inputs.year }}"
            MONTH="${{ inputs.month }}"
          fi

          MONTH=$(printf "%02d" "$((10#$MONTH))")

          echo "noticia_id=$NOTICIA_ID" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"

      - name: Mostrar parámetros
        shell: bash
        run: |
          echo "Noticia ID: ${{ steps.params.outputs.noticia_id }}"
          echo "URL: ${{ steps.params.outputs.url }}"
          echo "Año: ${{ steps.params.outputs.year }}"
          echo "Mes: ${{ steps.params.outputs.month }}"

      - name: Resolver imagen
        run: |
          python scripts/resolve_og.py \
            "${{ steps.params.outputs.noticia_id }}" \
            "${{ steps.params.outputs.url }}" \
            "${{ steps.params.outputs.year }}" \
            "${{ steps.params.outputs.month }}"

      - name: Guardar imagen en repositorio
        shell: bash
        run: |
          IMAGE_PATH="recap-images/${{ steps.params.outputs.year }}/${{ steps.params.outputs.month }}/${{ steps.params.outputs.noticia_id }}.jpg"

          if [ ! -f "$IMAGE_PATH" ]; then
            echo "ERROR: no existe la imagen esperada:"
            echo "$IMAGE_PATH"
            exit 1
          fi

          git config user.name "techtrends-bot"
          git config user.email "techtrends-bot@users.noreply.github.com"

          git add "$IMAGE_PATH"

          if git diff --cached --quiet; then
            echo "La imagen ya existe y no ha cambiado."
          else
            git commit -m "Add recap image ${{ steps.params.outputs.year }}/${{ steps.params.outputs.month }}/${{ steps.params.outputs.noticia_id }}"
            git push
          fi

name: TechTrends - Resolver OG Image

on:
  workflow_dispatch:
    inputs:
      noticiaId:
        description: "ID de la noticia en TT_Noticias"
        required: true
        type: string

      url:
        description: "URL de la noticia"
        required: true
        type: string

  repository_dispatch:
    types:
      - techtrends_news_image

permissions:
  contents: write

jobs:
  resolve-og:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4 pillow

      - name: Preparar parámetros
        id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "noticia_id=${{ github.event.client_payload.noticiaId }}" >> "$GITHUB_OUTPUT"
            echo "url=${{ github.event.client_payload.url }}" >> "$GITHUB_OUTPUT"
          else
            echo "noticia_id=${{ inputs.noticiaId }}" >> "$GITHUB_OUTPUT"
            echo "url=${{ inputs.url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Buscar imagen OG
        run: |
          python scripts/resolve_og.py \
            "${{ steps.params.outputs.noticia_id }}" \
            "${{ steps.params.outputs.url }}"

      - name: Guardar imagen temporal en el repositorio
        shell: bash
        run: |
          mkdir -p temp-images

          IMAGE_FILE="output/${{ steps.params.outputs.noticia_id }}.jpg"

          if [ -f "$IMAGE_FILE" ]; then

            cp "$IMAGE_FILE" "temp-images/${{ steps.params.outputs.noticia_id }}.jpg"

            git config user.name "techtrends-bot"
            git config user.email "techtrends-bot@users.noreply.github.com"

            git add "temp-images/${{ steps.params.outputs.noticia_id }}.jpg"

            if git diff --cached --quiet; then
              echo "No hay cambios que guardar."
            else
              git commit -m "Add temporary OG image for news ${{ steps.params.outputs.noticia_id }}"
              git push
            fi

          else
            echo "La noticia no tiene imagen. No se guarda ningún archivo."
          fi
